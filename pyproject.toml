[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-bill-auditor"
version = "0.1.0"
description = "Checks itemized medical bills for errors using Medicare NCCI rules and hospital price-transparency data, with cited dispute letters"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.1",
    "pandera[polars]>=0.36.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
billauditor = "billauditor.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
